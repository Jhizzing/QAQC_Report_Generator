analysis:
  blanks:
    blank_limit: 0.01
    carryover_threshold: 2.0
    contamination_threshold: 3.0
  duplicates:
    nugget_threshold: 0.5
    precision_limit: 10.0
    rpd_threshold: 20.0
  standards:
    precision_threshold: 5.0
    recovery_limits:
    - 95
    - 105
    z_score_threshold: 2.0
data:
  cleaning:
    csv_delimiter: ','
    default_detection_limit: 0.01
    encoding: utf-8
    normalize_sample_types: true
reporting:
  include_plots: true
  include_raw_data: true
  margins:
  - 1
  - 1
  - 1
  - 1
  page_size: A4
visualization:
  dpi: 300
  figure_size:
  - 10
  - 8
  style: seaborn-v0_8
