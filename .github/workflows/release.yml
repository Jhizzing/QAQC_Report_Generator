name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Ensure GitHub Release Exists
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release shell
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          generate_release_notes: true

  build:
    name: Build Release Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CLI and GUI executables
        run: |
          python scripts/build_executables.py --target all --clean

      - name: Smoke test packaged CLI
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          exe_name = "LogiQore-Reporter-CLI.exe" if os.name == "nt" else "LogiQore-Reporter-CLI"
          cli_exe = root / "dist" / "cli" / exe_name

          if not cli_exe.exists():
              raise SystemExit(f"CLI executable not found: {cli_exe}")

          subprocess.run([str(cli_exe), "--help"], check=True)

          out_dir = root / "output" / "ci_smoke_release"
          if out_dir.exists():
              shutil.rmtree(out_dir)

          cmd = [
              str(cli_exe),
              "--input", "mock_data/complex_test_data.csv",
              "--output", str(out_dir),
              "--infer-mapping",
              "--normalize-results",
              "--yes",
              "--auto-crm",
              "--output-format", "both",
          ]
          subprocess.run(cmd, check=True)

          has_pdf = any(out_dir.glob("*.pdf"))
          has_xlsx = any(out_dir.glob("*.xlsx"))
          if not has_pdf or not has_xlsx:
              raise SystemExit("Smoke test did not generate both PDF and XLSX outputs")

          print("Release smoke test passed")
          PY

      - name: Create platform release bundle
        shell: bash
        env:
          BUNDLE_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          dist_dir = root / "dist"
          output_dir = root / "release_assets"
          output_dir.mkdir(parents=True, exist_ok=True)

          bundle_name = f"logiqore-reporter-{os.environ['BUNDLE_OS']}.zip"
          bundle_path = output_dir / bundle_name

          with zipfile.ZipFile(bundle_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for subdir in ("cli", "gui"):
                  source_dir = dist_dir / subdir
                  if not source_dir.exists():
                      continue
                  for file_path in source_dir.rglob("*"):
                      if file_path.is_file():
                          archive.write(file_path, file_path.relative_to(dist_dir))

          if not bundle_path.exists() or bundle_path.stat().st_size == 0:
              raise SystemExit(f"Bundle not created correctly: {bundle_path}")

          print(f"Created release bundle: {bundle_path}")
          PY

      - name: Upload platform bundle to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" release_assets/*.zip \
            --repo "${{ github.repository }}" \
            --clobber

  finalize:
    name: Finalize Release Assets
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundles
        run: |
          set -euo pipefail
          mkdir -p release_assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "logiqore-reporter-*.zip" \
            --dir release_assets
          ls -la release_assets

      - name: Generate SHA256 manifest
        run: |
          set -euo pipefail
          find release_assets -maxdepth 1 -type f -name 'logiqore-reporter-*.zip' \
            -print0 | sort -z | xargs -0 sha256sum > release_assets/SHA256SUMS.txt
          cat release_assets/SHA256SUMS.txt

      - name: Import release signing key
        if: ${{ env.RELEASE_GPG_PRIVATE_KEY != '' && env.RELEASE_GPG_PASSPHRASE != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ env.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ env.RELEASE_GPG_PASSPHRASE }}

      - name: Sign checksum manifest
        if: ${{ env.RELEASE_GPG_PRIVATE_KEY != '' && env.RELEASE_GPG_PASSPHRASE != '' }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --armor \
            --detach-sign --output release_assets/SHA256SUMS.txt.asc release_assets/SHA256SUMS.txt

      - name: Generate beta manifest
        run: |
          python scripts/generate_beta_manifest.py \
            --release-assets-dir release_assets \
            --output release_assets/logiqore-reporter-beta-manifest.json \
            --version "${{ github.ref_name }}"

      - name: Upload metadata assets to release
        run: |
          set -euo pipefail
          assets=(
            release_assets/SHA256SUMS.txt
            release_assets/logiqore-reporter-beta-manifest.json
          )
          if [ -f release_assets/SHA256SUMS.txt.asc ]; then
            assets+=(release_assets/SHA256SUMS.txt.asc)
          fi
          gh release upload "${{ github.ref_name }}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

  publish-public-downloads:
    name: Publish Public Download Mirror
    runs-on: ubuntu-latest
    needs: finalize
    if: ${{ vars.PUBLIC_RELEASE_REPO != '' }}
    env:
      TAG_NAME: ${{ github.ref_name }}
      PRIVATE_REPO: ${{ github.repository }}
      PUBLIC_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
      PRIVATE_GH_TOKEN: ${{ github.token }}
      PUBLIC_GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
    steps:
      - name: Validate mirror token
        if: ${{ env.PUBLIC_GH_TOKEN == '' }}
        run: |
          echo "PUBLIC_RELEASE_TOKEN is not set; skipping public mirror publish."
          exit 0

      - name: Download release assets from private source repo
        if: ${{ env.PUBLIC_GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          mkdir -p public_release_assets
          GH_TOKEN="${PRIVATE_GH_TOKEN}" gh release download "${TAG_NAME}" \
            --repo "${PRIVATE_REPO}" \
            --pattern "logiqore-reporter-*.zip" \
            --pattern "SHA256SUMS.txt" \
            --pattern "SHA256SUMS.txt.asc" \
            --pattern "logiqore-reporter-beta-manifest.json" \
            --dir public_release_assets
          ls -la public_release_assets

      - name: Ensure public mirror release exists
        if: ${{ env.PUBLIC_GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if ! GH_TOKEN="${PUBLIC_GH_TOKEN}" gh release view "${TAG_NAME}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            GH_TOKEN="${PUBLIC_GH_TOKEN}" gh release create "${TAG_NAME}" \
              --repo "${PUBLIC_REPO}" \
              --title "${TAG_NAME}" \
              --notes "Public binary mirror for LogiQore Reporter beta releases." \
              --prerelease
          fi

      - name: Upload mirror assets
        if: ${{ env.PUBLIC_GH_TOKEN != '' }}
        run: |
          set -euo pipefail
          GH_TOKEN="${PUBLIC_GH_TOKEN}" gh release upload "${TAG_NAME}" public_release_assets/* \
            --repo "${PUBLIC_REPO}" \
            --clobber
